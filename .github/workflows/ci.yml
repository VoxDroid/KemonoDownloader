name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; artifact uploads use their own token.
permissions:
  contents: read

# A new push to a pull request supersedes its previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the pyright hook in .pre-commit-config.yaml. Pinned so a
  # new pyright release can't fail CI on unchanged code.
  PYRIGHT_VERSION: "1.1.414"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          # pyright runs in the type-check job, with the app's dependencies
          # installed, so the hook would only repeat a weaker check.
          SKIP: pyright
        run: |
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every leg finish so one broken runner doesn't hide results from the others.
      fail-fast: false
      matrix:
        # The oldest supported, a middle and the newest Python on every OS;
        # the versions in between on Linux only.
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        python-version: ['3.9', '3.11', '3.14']
        # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build in setup-python,
        # so the 3.9 Linux leg runs on 24.04 instead.
        exclude:
          - os: ubuntu-latest
            python-version: '3.9'
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v6
      - name: Install system libraries (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxkbcommon0 libxcb-xinerama0 libpulse0 libpulse-mainloop-glib0 libasound2t64 mesa-utils
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q --junitxml=test-results/junit.xml
      - name: Upload test logs (optional)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # Make artifact name unique per matrix job and run to avoid 409 Conflict when multiple jobs upload
          name: pytest-logs-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
          retention-days: 14

  type-check:
    name: Type checking (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install pyright
        run: |
          npm install -g "pyright@${PYRIGHT_VERSION}"
      - name: Run pyright
        run: |
          pyright --project ./pyrightconfig.json
